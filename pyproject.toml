[build-system]
requires = ['hatchling >= 1.26']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ["src/cham_logging"]

[project]
name = "cham-logging"
version = "0.1.0"
description = "A small stdlib-only helper for configuring Python logging."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Cham" },
]
dependencies = []
