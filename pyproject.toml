[build-system]
requires = ['hatchling >= 1.26']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ["src/cham_logging"]

[project]
name = "cham-logging"
version = "0.1.2"
description = "A small stdlib-only helper for configuring Python logging."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Cham" },
]
keywords = ["logging", "stdlib"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Chamkang6093/cham-logging"
